name: Deploy Backend (Firebase)

# Backend deploy pipeline (Cloud Functions, Firestore rules/indexes, Storage rules).
#   push to main  ->  deploy to PROD  (divit-6d217), behind the "production" approval gate
# Only fires when a backend file changes, and the functions build must pass first.
# Beta is deployed manually (`firebase deploy ... --project beta`) when needed.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "shared/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # manual run from the Actions tab (deploys the selected branch's tree to prod)

# Don't run two deploys for the same branch at once.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main -> production (add required reviewers to this Environment for an approval gate).
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # Gate: a non-compiling change must never reach prod.
      - name: Build functions (typecheck gate)
        working-directory: functions
        run: npm run build

      - name: Write service account credentials
        env:
          SA_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_PROD" ]; then
            echo "::error::Missing service account secret. Add FIREBASE_SERVICE_ACCOUNT (prod) in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SA_PROD" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase
        run: |
          echo "Deploying backend to 'prod'..."
          npx --yes firebase-tools@13 deploy \
            --only functions,firestore,storage \
            --project prod \
            --non-interactive \
            --force
