name: Android Internal Testing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload the AAB to Play (default: build only)'
        type: boolean
        default: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build web app
        run: npm run build
        env:
          # Native loads index.html at the webview root and needs RELATIVE asset
          # paths. Without this the app installs and opens to a white screen
          # (see vite.config.ts and commit e61a3de). Asserted in the next step.
          CAPACITOR_BUILD: '1'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Assert native asset paths
        run: node scripts/assert-native-build.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release AAB
        working-directory: android
        run: |
          export VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          echo "Building with VERSION_CODE=$VERSION_CODE"
          ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload-key

      # Compilation alone does not prove the manifest merged as intended:
      # res/xml resources are not schema-validated, so a wrong
      # dataExtractionRules file builds green. Print what actually landed.
      - name: Report toolchain and merged manifest (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: |
          echo "== toolchain =="
          grep -n 'tools.build:gradle' build.gradle
          grep -nE 'compileSdkVersion|targetSdkVersion' variables.gradle
          echo "== merged AndroidManifest — backup attributes =="
          f=$(find app/build -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "file: ${f:-<not found>}"
          if [ -n "$f" ]; then
            grep -oE 'android:(allowBackup|dataExtractionRules)="[^"]*"' "$f" \
              || echo "!! backup attributes absent from merged manifest"
          fi

      - name: Upload AAB for inspection (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-dry-run
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # Everything below this point talks to Play. A manual run stops here
      # unless publish=true, which is the only way to answer "does the Android
      # build still compile?" without shipping a draft AAB — useful for
      # toolchain changes (AGP, compileSdk/targetSdk, manifest merges) that CI
      # does not otherwise build. A push to main always publishes, as before.
      #
      # The flag is opt-IN deliberately: workflow_dispatch inputs are validated
      # against the DEFAULT branch's copy of this file, so a dispatch that
      # passes no inputs works even when testing a branch whose workflow
      # definition has not landed on main yet.
      - name: Debug service account
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          echo "File size: $(wc -c < /tmp/sa.json) bytes"
          echo "Valid JSON: $(python3 -c 'import json; f=open("/tmp/sa.json"); d=json.load(f); print("YES"); print("type:", d.get("type","")); print("project_id:", d.get("project_id","")); print("client_email:", d.get("client_email",""))' 2>&1 || echo 'NO - invalid JSON')"
          rm /tmp/sa.json

      - name: Upload to Play Store Internal Testing
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.singhkapoortech.divit
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
