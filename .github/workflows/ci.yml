name: CI

# Backend-focused gate for every PR (and pushes to main). Must pass before a
# change is deployed. Frontend/app releases are gated manually via the app
# stores, so this intentionally focuses on backend safety: lint, unit tests for
# shared/backend logic, and a functions typecheck/build.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Informational only: the repo currently has pre-existing lint errors, so
      # this reports them without blocking. Make it a hard gate once they're cleaned up.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Ratchet, not a pass/fail gate: the repo carries 36 pre-existing type
      # errors, so a plain `npm run typecheck` would be red on every run and
      # therefore ignored. This fails only when the count RISES above the
      # recorded baseline, so new type errors are caught immediately while the
      # existing debt is paid down. Lower MAX as errors are cleared.
      #
      # Uses `npm run typecheck` so the config can't drift from the local
      # command. That script targets tsconfig.app.json — the root tsconfig.json
      # is a reference-only stub ("files": []) that checks ZERO files, exits 0,
      # and would make this gate pass vacuously.
      - name: Typecheck (ratchet — baseline 36)
        run: |
          MAX=36
          OUT=$(npm run --silent typecheck 2>&1) && STATUS=0 || STATUS=$?
          N=$(printf '%s\n' "$OUT" | grep -c 'error TS' || true)
          echo "$OUT"
          echo "type errors: $N (budget $MAX, tsc exit $STATUS)"

          # Guard against a vacuous pass: tsc exiting non-zero while reporting
          # no "error TS" lines means it failed to RUN (bad config, OOM, crash)
          # rather than finding a clean tree. Treat that as a hard failure —
          # a check that cannot fail is worse than no check.
          if [ "$STATUS" -ne 0 ] && [ "$N" -eq 0 ]; then
            echo "::error::tsc failed to run (exit $STATUS) without reporting type errors"
            exit 1
          fi

          if [ "$N" -gt "$MAX" ]; then
            echo "::error::type errors rose $MAX -> $N"
            exit 1
          fi

      # MUST come before `npm test`. The unit suite covers the RevenueCat
      # webhook's HTTP shell, and that test resolves `firebase-admin/*` out of
      # functions/node_modules (the shell imports firebase-functions, which
      # needs a single admin instance). Those deps used to be installed only by
      # the "Functions typecheck/build" step further down, so `npm test` ran
      # before they existed and the whole file failed to load with
      # `Cannot find module 'firebase-admin/app'` — 23 tests reported as
      # SKIPPED, not failed. It passed locally because a developer who has
      # built functions once already has the directory.
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Unit tests (shared/backend logic)
        run: npm test

      # Security rules are a production boundary and the Admin-SDK integration
      # suite bypasses them entirely, so nothing else here can catch a rules
      # regression. The emulator needs two things CI does not have by default:
      # a JDK 21+ (ubuntu-latest ships an older Java, and firebase-tools refuses
      # anything below 21) and the firebase CLI, which is a global install
      # locally rather than a repo dependency.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Security rules tests
        run: npm run test:rules

      # Compiles functions/src AND ../shared — catches backend type errors before deploy.
      # Dependencies are installed above, before the unit tests that need them.
      - name: Functions typecheck/build
        working-directory: functions
        run: npm run build

  # ── End-to-end browser tests ────────────────────────────────────────────────
  # WHY THIS JOB EXISTS: the suite already existed but ran nowhere, and that cost
  # us. Moving event creation to a Cloud Function callable broke every
  # event-creation spec — the emulator harness started only auth+firestore, so
  # the callable had nothing to answer it — and nothing reported it. A suite that
  # runs on no one's machine is not a safety net.
  #
  # Separate job, not more steps on `checks`: it needs Playwright browsers and
  # the functions emulator, and keeping it separate means a browser flake never
  # hides a unit or rules failure.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The Firestore/Auth emulators are Java; firebase-tools refuses < 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # The functions emulator serves compiled output from functions/lib, so the
      # build must exist and be current before the emulator starts — a stale or
      # missing lib silently serves nothing and every callable times out.
      - name: Build functions (served by the functions emulator)
        working-directory: functions
        run: |
          npm ci
          npm run build

      # Chromium only — the suite defines a single chromium project.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # global-setup starts auth+firestore+functions and warms a login; the
      # config's webServer starts vite with VITE_USE_EMULATORS=true. Nothing
      # here touches a real Firebase project.
      # The app's Firebase config comes from `.env`, which is gitignored and so
      # absent in CI. `src/config/firebase.ts` calls `getAuth(app)` at module
      # scope, and that THROWS `auth/invalid-api-key` on an empty key — before
      # `connectAuthEmulator` ever runs. The module therefore failed to import,
      # React never mounted, and all 16 specs timed out after 90s waiting for a
      # "Sign in with Google" button on a blank page. That looked like 16
      # unrelated test failures; it was one missing config.
      #
      # These values are fake and are not secrets. Everything is routed to the
      # local emulators, which accept any API key. `projectId` must be the real
      # one because global-setup runs `firebase emulators:start` with no
      # --project (so it takes `.firebaserc`'s default) and firebase.json sets
      # singleProjectMode. Were the emulators ever bypassed, the fake key means
      # nothing could authenticate against the real project anyway.
      - name: E2E tests
        run: npm run test:e2e
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDUMMY-emulator-only-not-a-real-key
          VITE_FIREBASE_AUTH_DOMAIN: divit-6d217.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: divit-6d217
          VITE_FIREBASE_STORAGE_BUCKET: divit-6d217.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

      # Video and trace are captured on failure only (playwright.config.ts), so
      # this uploads something worth downloading rather than gigabytes of
      # passing runs.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
